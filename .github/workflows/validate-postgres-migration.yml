name: Validate Supabase migration image

on:
  push:
    branches:
      - deploy/supabase-postgres
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "BUSCA-AI/**/*.php"
      - ".github/workflows/validate-postgres-migration.yml"

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build migration image
        run: docker build --pull -t busca-ai-postgres-validation .
